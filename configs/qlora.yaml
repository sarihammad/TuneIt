model:
  model_name: facebook/opt-125m
  max_length: 512
  load_in_4bit: true
  torch_dtype: bfloat16
  device_map: auto

qlora:
  r: 64
  lora_alpha: 16
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  bits: 4
  double_quant: true
  quant_type: nf4

training:
  method: qlora
  output_dir: outputs
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 100
  save_steps: 200
  fp16: false
  bf16: true
  optim: paged_adamw_8bit
  report_to: none
  seed: 42
  max_steps: -1
